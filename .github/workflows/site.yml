# Publishes site/ to GitHub Pages on every push that changes it.
name: Deploy site

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          mkdir -p _site
          cp -r site/. _site/
          # the page loads the approach data as a script; approaches.json is the file to edit
          printf 'window.APPROACHES_DATA=%s;\n' "$(cat site/approaches.json)" > _site/approaches.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

# Deploys the poller to Cloudflare on every push that changes it (or the approach data it uses).
# Needs two repository secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
name: Deploy poller

on:
  push:
    branches: [main]
    paths: ["worker/**", "site/approaches.json", ".github/workflows/worker.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the Cloudflare secrets are set
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under Settings > Secrets and variables > Actions."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy
        working-directory: worker
        # BUILD_ID lets an already-running poller notice the new code and restart itself
        run: npx --yes wrangler@4 deploy --var BUILD_ID:${{ github.sha }}
      - name: Pass data-source keys to the poller
        working-directory: worker
        env:
          FLYITALY_API_KEY: ${{ secrets.FLYITALY_API_KEY }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: |
          if [ -n "$INGEST_TOKEN" ]; then
            printf '%s' "$INGEST_TOKEN" | npx --yes wrangler@4 secret put INGEST_TOKEN
          else
            echo "No INGEST_TOKEN secret set; the home relay can't send data yet."
          fi
          if [ -n "$FLYITALY_API_KEY" ]; then
            printf '%s' "$FLYITALY_API_KEY" | npx --yes wrangler@4 secret put FLYITALY_API_KEY
          else
            echo "No FLYITALY_API_KEY secret set; using the keyless sources only."
          fi
      - name: Let whatsabove.nyc read the data files
        working-directory: worker
        run: npx --yes wrangler@4 r2 bucket cors set whatsabove-data --file r2-cors.json --force

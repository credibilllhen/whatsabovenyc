name = "whatsabove-poller"
main = "src/index.js"
compatibility_date = "2026-11-01"

# Publishes /status (and fallback copies of live.json and history.json) on workers.dev.
workers_dev = true

# Pokes the poller every minute, so it starts on the first deploy and restarts if it ever stops.
[triggers]
crons = ["* * * * *"]

[[durable_objects.bindings]]
name = "POLLER"
class_name = "PollerV2"

# The free plan needs SQLite-backed Durable Objects.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Poller"]

# v2 moves the poller to a new class, so it starts fresh on the current code;
# it restores its state from history.json. The old class is retired in v3.
[[migrations]]
tag = "v2"
new_sqlite_classes = ["PollerV2"]

[[r2_buckets]]
binding = "DATA"
bucket_name = "whatsabove-data"

[vars]
ADSB_URL = "https://api.adsb.lol"
ADSB_PATH = "/v2/point/{lat}/{lon}/{dist}"
RADIUS_NM = "40"
# 10 s fits the free plan. On the $5 Workers plan, 5 is fine.
POLL_SECONDS = "10"
ALLOWED_ORIGIN = "https://whatsabove.nyc"

[observability]
enabled = true
